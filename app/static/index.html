<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="version" content="v2.0-20261001f">
<title>连锁酒店管理助手</title>
<link rel="stylesheet" href="/static/css/style.css?v=v2.0-20261001e">
</head>
<body>

<!-- ===== 顶栏 ===== -->
<nav class="navbar">
  <div class="brand">
    <span class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
        <path d="m7 14 3.5-3.5 3 3L21 7"/>
      </svg>
    </span>
    <span>连锁酒店管理助手</span>
  </div>
  <div class="user-box">
    <span class="conn-dot" id="connDot" title="服务连接状态"></span>
    <span class="conn-text" id="connText">检测中…</span>
    <span class="email-text" id="emailText" style="margin-left:6px"></span>
    <button class="btn btn-primary btn-sm" id="loginBtn" onclick="openModal()">登录 / 注册</button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="display:none" onclick="logout()">退出</button>
  </div>
</nav>

<!-- ===== 聊天区 ===== -->
<div class="chat-wrap" style="position:relative">
  <!-- 回到底部。往回翻长对话时才出现 -->
  <button class="scroll-bottom-btn" id="scrollBottomBtn" type="button" title="回到最新消息" onclick="scrollToBottom()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>
    </svg>
  </button>
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="avatar">AI</div>
      <div class="bubble-col">
        <div class="bubble">你好！我是连锁酒店管理助手。<br>可以问我：各酒店入住率（OCC）、平均房价（ADR）、RevPAR、间夜量、渠道/OTA 占比、餐饮营收、差评与投诉闭环等，我可以查库、画图、做分析、或者帮你发邮件通知。</div>
      </div>
    </div>
  </div>
  <div class="input-bar">
    <button class="collapse-toggle" id="collapseBtn" onclick="toggleSuggestCollapse()" title="折叠 / 展开">
      <span class="arrow">▼</span><span>收起</span>
    </button>
    <div class="suggest-list" id="suggestList">
      <span class="suggest" data-q="8月入住率 TOP5 的酒店是哪些">🏆 OCC TOP5</span>
      <span class="suggest" data-q="8月平均房价 ADR 是多少">💰 平均房价</span>
      <span class="suggest" data-q="按渠道统计预订量，画个柱状图">📊 渠道预订量</span>
      <span class="suggest" data-q="各渠道房费收入占比饼图">🥧 渠道收入占比</span>
      <span class="suggest" data-q="最近 6 个月 RevPAR 趋势折线图">📈 6 月 RevPAR</span>
      <span class="suggest" data-q="按城市看入住率排名">🗺️ 城市 OCC</span>
      <span class="suggest" data-q="比较8月和7月的入住率和 RevPAR 差异">⚖️ 月度环比</span>
      <span class="suggest" data-q="对比各酒店的 OCC 和 ADR">🌏 门店对比</span>
      <span class="suggest" data-q="把上周的酒店经营报告汇总发邮件给分公司老板">📧 发报告给老板</span>
      <span class="suggest" data-q="检查未闭环的投诉并通知店长">🚨 投诉催办</span>
      <span class="suggest" data-q="把本周差评清单发给前厅经理">📝 差评清单</span>
    </div>
    <div class="input-box">
      <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" title="发送（Enter）">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- ===== 登录弹窗 ===== -->
<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">欢迎使用</h3>
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tabReg" onclick="switchTab('register')">注册</div>
    </div>
    <div class="form-row">
      <label>邮箱</label>
      <input id="emailInput" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-row">
      <label>验证码</label>
      <div class="code-row">
        <input id="codeInput" placeholder="6 位验证码" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
        <button class="btn btn-ghost" id="codeBtn" onclick="getCode()">获取验证码</button>
      </div>
    </div>
    <button class="btn btn-primary submit" id="submitBtn" onclick="submitAuth()">登录</button>
    <div class="tips">验证码会发送到你的邮箱，请先点击“获取验证码”</div>
  </div>
</div>

<!-- ===== Toast 容器 ===== -->
<div class="toast-container" id="toastContainer"></div>

<script src="/static/js/app.js?v=v2.0-20261001f"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基于 LangGraph 与 RAG 的多智能体问答平台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #eef2f7 0%, #f8fafc 100%);
    height: 100vh; display: flex; flex-direction: column; color: #1f2937;
  }

  /* ===== 顶栏 ===== */
  .navbar {
    height: 56px; background: #fff; display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); z-index: 10;
  }
  .navbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; }
  .navbar .brand .logo {
    width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, #4f8cff, #7c5cff);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
  }
  .navbar .user-box { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .navbar .user-box .email-text { color: #4b5563; }
  .btn {
    border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer;
    font-size: 14px; transition: all .15s;
  }
  .btn-primary { background: #4f8cff; color: #fff; }
  .btn-primary:hover { background: #3a76e8; }
  .btn-ghost { background: transparent; color: #4b5563; border: 1px solid #d1d5db; }
  .btn-ghost:hover { background: #f3f4f6; }
  .btn-sm { padding: 5px 12px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== 主聊天区 ===== */
  .chat-wrap { flex: 1; display: flex; flex-direction: column; max-width: 860px; width: 100%; margin: 0 auto; padding: 0 16px; }
  .messages { flex: 1; overflow-y: auto; padding: 20px 4px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px;
  }
  .msg.user .avatar { background: linear-gradient(135deg, #4f8cff, #7c5cff); }
  .msg.bot .avatar { background: #64748b; }
  .msg .bubble {
    background: #fff; border-radius: 12px; padding: 12px 14px; line-height: 1.7;
    font-size: 14.5px; word-break: break-word; white-space: pre-wrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  .msg.user .bubble { background: #4f8cff; color: #fff; border-top-right-radius: 4px; }
  .msg.bot .bubble { border-top-left-radius: 4px; }
  .msg.bot .bubble .cursor { display: inline-block; width: 8px; height: 15px; background: #4f8cff; vertical-align: -2px; margin-left: 2px; animation: blink 1s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  /* ===== 图表卡片 ===== */
  .chart-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); overflow: hidden; }
  .chart-card .chart-title { padding: 12px 16px 0; font-weight: 600; font-size: 15px; }
  .chart-box { width: 100%; height: 320px; }

  /* ===== 输入区 ===== */
  .input-bar { padding: 12px 0 20px; }
  .input-box {
    display: flex; gap: 10px; background: #fff; border-radius: 12px; padding: 8px 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.08); border: 1px solid #e5e7eb;
  }
  .input-box textarea {
    flex: 1; border: none; outline: none; resize: none; font-size: 14.5px;
    line-height: 1.6; font-family: inherit; padding: 6px; height: 24px; max-height: 120px; background: transparent;
  }
  .suggest-list { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .suggest {
    background: #eef4ff; color: #3a76e8; border: 1px solid #d6e4ff; border-radius: 16px;
    padding: 5px 12px; font-size: 13px; cursor: pointer; transition: all .15s;
  }
  .suggest:hover { background: #dce9ff; }

  /* ===== 登录弹窗 ===== */
  .mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; z-index: 100; }
  .mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; width: 400px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal h3 { margin-bottom: 18px; font-size: 19px; text-align: center; }
  .tabs { display: flex; background: #f3f4f6; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
  .tabs .tab { flex: 1; text-align: center; padding: 8px 0; border-radius: 8px; cursor: pointer; font-size: 14px; color: #6b7280; }
  .tabs .tab.active { background: #fff; color: #4f8cff; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .form-row input {
    width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none;
  }
  .form-row input:focus { border-color: #4f8cff; }
  .code-row { display: flex; gap: 8px; }
  .code-row input { flex: 1; }
  .code-row .btn { white-space: nowrap; }
  .modal .submit { width: 100%; margin-top: 6px; }
  .modal .tips { margin-top: 12px; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.6; }
  .modal-close { position: absolute; }
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<nav class="navbar">
  <div class="brand">
    <div class="logo">MA</div>
    <span>多智能体问答平台</span>
  </div>
  <div class="user-box" id="userBox">
    <span class="email-text" id="emailText"></span>
    <button class="btn btn-primary btn-sm" id="loginBtn" onclick="openModal()">登录 / 注册</button>
    <button class="btn btn-ghost btn-sm" id="logoutBtn" style="display:none" onclick="logout()">退出</button>
  </div>
</nav>

<!-- ===== 聊天区 ===== -->
<div class="chat-wrap">
  <div class="messages" id="messages">
    <div class="msg bot">
      <div class="avatar">AI</div>
      <div class="bubble">你好！我是数据分析助手。<br>可以问我：产品类别销售额、按月销售趋势、各区域客单价等，我可以查库、画图、做分析。</div>
    </div>
  </div>
  <div class="input-bar">
    <div class="suggest-list">
      <span class="suggest" onclick="askBySuggest(this)">按类别统计销售额画柱状图</span>
      <span class="suggest" onclick="askBySuggest(this)">各品类销量占比饼图</span>
      <span class="suggest" onclick="askBySuggest(this)">按月销售趋势折线图</span>
      <span class="suggest" onclick="askBySuggest(this)">客单价是多少</span>
    </div>
    <div class="input-box">
      <textarea id="input" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="btn btn-primary" id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<!-- ===== 登录弹窗 ===== -->
<div class="mask" id="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">欢迎使用</h3>
    <div class="tabs">
      <div class="tab active" id="tabLogin" onclick="switchTab('login')">登录</div>
      <div class="tab" id="tabReg" onclick="switchTab('register')">注册</div>
    </div>
    <div class="form-row">
      <label>邮箱</label>
      <input id="emailInput" type="email" placeholder="you@example.com">
    </div>
    <div class="form-row">
      <label>验证码</label>
      <div class="code-row">
        <input id="codeInput" placeholder="6 位验证码">
        <button class="btn btn-ghost" id="codeBtn" onclick="getCode()">获取验证码</button>
      </div>
    </div>
    <button class="btn btn-primary submit" id="submitBtn" onclick="submitAuth()">登录</button>
    <div class="tips">验证码会发送到你的邮箱（需已在 user_info 表注册的邮箱才能登录）</div>
  </div>
</div>

<script>
(function loadECharts() {
  // 多源 CDN 兜底加载 echarts：第一个成功就不继续
  var urls = [
    "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
    "https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js",
    "https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"
  ];
  var i = 0;
  function next() {
    if (window.echarts) return;
    if (i >= urls.length) { console.warn("echarts 加载失败，图表将无法显示"); return; }
    var s = document.createElement("script");
    s.src = urls[i++];
    s.onload = next;
    s.onerror = next;
    document.head.appendChild(s);
  }
  next();
})();

/* ================= 状态 ================= */
var currentTab = "login";
var sending = false;
var email = localStorage.getItem("platform_email") || "";
updateUserBar();

/* ================= 登录 / 注册 ================= */
function openModal() { document.getElementById("mask").classList.add("show"); }
function closeModal() { document.getElementById("mask").classList.remove("show"); }

function switchTab(tab) {
  currentTab = tab;
  document.getElementById("tabLogin").classList.toggle("active", tab === "login");
  document.getElementById("tabReg").classList.toggle("active", tab === "register");
  document.getElementById("submitBtn").textContent = tab === "login" ? "登录" : "注册";
  document.getElementById("modalTitle").textContent = tab === "login" ? "欢迎登录" : "注册新账号";
}

function getCode() {
  var email = document.getElementById("emailInput").value.trim();
  if (!email || email.indexOf("@") < 0) { alert("请输入正确的邮箱"); return; }
  var isReg = currentTab === "register";
  var btn = document.getElementById("codeBtn");
  fetch((isReg ? "/register_send_code" : "/send_code"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email })
  }).then(function (r) { return r.json(); }).then(function (res) {
    alert(res.msg || (res.code === 200 ? "验证码已发送" : "发送失败"));
    if (res.code === 200) countdown(btn, 60);
  }).catch(function () { alert("请求失败，请检查后端是否在运行"); });
}

function countdown(btn, sec) {
  btn.disabled = true;
  btn.textContent = sec + "s 后重试";
  var t = setInterval(function () {
    sec--;
    if (sec <= 0) { clearInterval(t); btn.disabled = false; btn.textContent = "获取验证码"; }
    else btn.textContent = sec + "s 后重试";
  }, 1000);
}

function submitAuth() {
  var email = document.getElementById("emailInput").value.trim();
  var code = document.getElementById("codeInput").value.trim();
  if (!email || !code) { alert("请填写邮箱和验证码"); return; }
  var url = currentTab === "login" ? "/login" : "/register";
  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, code: code })
  }).then(function (r) { return r.json(); }).then(function (res) {
    if (res.code === 200) {
      alert(res.msg);
      // 登录/注册成功后刷新顶栏：把邮箱存本地 + 同步全局变量
      // 注意：本函数内 var email 是【局部变量】，会遮蔽第191行的全局 email，
      // 所以必须用 window.email 显式写全局变量，否则 updateUserBar() 读到的仍是旧值（顶栏不刷新）
      window.email = email;
      localStorage.setItem("platform_email", email);
      updateUserBar();
      closeModal();
    } else {
      alert(res.msg || "操作失败");
    }
  }).catch(function () { alert("请求失败，请检查后端是否在运行"); });
}

function logout() {
  localStorage.removeItem("platform_email");
  email = "";
  updateUserBar();
}

function updateUserBar() {
  var isLogin = !!email;
  document.getElementById("loginBtn").style.display = isLogin ? "none" : "";
  document.getElementById("logoutBtn").style.display = isLogin ? "" : "none";
  document.getElementById("emailText").textContent = isLogin ? email : "未登录（可先体验）";
}

/* ================= 聊天（SSE 流式） ================= */
function addMsg(role, text) {
  var wrap = document.getElementById("messages");
  var div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = '<div class="avatar">' + (role === "user" ? "我" : "AI") + '</div><div class="bubble">' + text + "</div>";
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div;
}

function addBotMsg() {
  var wrap = document.getElementById("messages");
  var div = document.createElement("div");
  div.className = "msg bot";
  div.innerHTML = '<div class="avatar">AI</div><div class="bubble"></div>';
  wrap.appendChild(div);
  wrap.scrollTop = wrap.scrollHeight;
  return div.querySelector(".bubble");
}

function renderChart(chart) {
  if (!window.echarts) { alert("图表组件加载失败"); return; }
  var wrap = document.getElementById("messages");
  var card = document.createElement("div");
  card.className = "chart-card";
  card.innerHTML = '<div class="chart-title"></div><div class="chart-box"></div>';
  wrap.appendChild(card);
  var title = chart.title || "数据图表";
  card.querySelector(".chart-title").textContent = title;
  var box = card.querySelector(".chart-box");
  var myChart = echarts.init(box);

  // ChartData → echarts option
  var option;
  if (chart.chart_type === "pie") {
    option = {
      tooltip: { trigger: "item", formatter: "{b}: {c} ({d}%)" },
      legend: { bottom: 0 },
      series: [{
        type: "pie", radius: ["35%", "62%"],
        data: (chart.x_axis || []).map(function (n, i) { return { name: n, value: (chart.series || [])[i] }; })
      }]
    };
  } else {
    var isLine = chart.chart_type === "line";
    option = {
      tooltip: { trigger: "axis" },
      grid: { left: 45, right: 20, top: 45, bottom: 35 },
      xAxis: { type: "category", data: chart.x_axis || [] },
      yAxis: { type: "value" },
      series: [{
        type: isLine ? "line" : "bar", data: chart.series || [],
        smooth: isLine, barMaxWidth: 40,
        itemStyle: { color: "#4f8cff", borderRadius: isLine ? 0 : [4, 4, 0, 0] },
        lineStyle: { width: 3 }, areaStyle: isLine ? { opacity: 0.15 } : undefined
      }]
    };
  }
  myChart.setOption(option);
  window.addEventListener("resize", function () { myChart.resize(); });
  wrap.scrollTop = wrap.scrollHeight;
}

function send() {
  if (sending) return;
  var input = document.getElementById("input");
  var q = input.value.trim();
  if (!q) return;
  input.value = "";
  input.style.height = "24px";
  addMsg("user", escapeHtml(q));

  var bubble = addBotMsg();
  var isFirst = true;
  var threadId = email || "default";   // 登录后按邮箱隔离记忆
  sending = true;
  document.getElementById("sendBtn").disabled = true;

  var es = new EventSource("/chat?question=" + encodeURIComponent(q) + "&thread_id=" + encodeURIComponent(threadId));
  es.onmessage = function (e) {
    var d = JSON.parse(e.data);
    if (d.done) { es.close(); sending = false; document.getElementById("sendBtn").disabled = false; bubble.classList.remove("cursor"); return; }
    if (d.type === "chart") {
      renderChart(d.content);
    } else {
      bubble.innerHTML += escapeHtml(d.content);
      if (isFirst) { bubble.innerHTML += '<span class="cursor"></span>'; isFirst = false; }
      document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
    }
  };
  es.onerror = function () {
    es.close();
    if (sending) { sending = false; document.getElementById("sendBtn").disabled = false; bubble.innerHTML = "连接中断，请稍后重试"; }
  };
}

function askBySuggest(el) {
  document.getElementById("input").value = el.textContent;
  send();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ================= 输入框事件 ================= */
var input = document.getElementById("input");
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", function () {
  this.style.height = "24px";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
});
</script>
</body>
</html>
